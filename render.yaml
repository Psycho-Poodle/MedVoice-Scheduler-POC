services:
  - type: web
    name: medvoice-scheduler-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    branch: render-deploy
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medvoice-scheduler-db
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        value: "https://medvoice-scheduler-poc-1.onrender.com,https://medvoice-scheduler-frontend.onrender.com,http://localhost:5173"
      - key: DB_SEED_ON_STARTUP
        value: "true"
      - key: OPENAI_REALTIME_MODEL
        value: "gpt-realtime"
      - key: OPENAI_REALTIME_VOICE
        value: "alloy"
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_LIVE_MODEL
        value: "gemini-3.1-flash-live-preview"
      - key: GEMINI_TTS_MODEL
        value: "gemini-2.5-flash-preview-tts"
      - key: GEMINI_TRANSCRIPTION_MODEL
        value: "gemini-2.5-flash-lite"
      - key: GEMINI_LIVE_VOICE
        value: "Kore"
      - key: VAPI_API_KEY
        sync: false
      - key: VAPI_ASSISTANT_ID
        sync: false
      - key: VAPI_PHONE_NUMBER_ID
        sync: false
      - key: VAPI_BASE_URL
        value: "https://api.vapi.ai"
      - key: VAPI_REMINDER_ENABLED
        value: "false"
      - key: VAPI_REMINDER_INTERVAL_SECONDS
        value: "7200"
      - key: VAPI_REMINDER_STARTUP_DELAY_SECONDS
        value: "30"
  - type: web
    name: medvoice-scheduler-mcp-server
    runtime: docker
    dockerfilePath: mcp-server/Dockerfile
    dockerContext: .
    branch: render-deploy
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medvoice-scheduler-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
  - type: web
    name: medvoice-scheduler-frontend
    runtime: static
    rootDir: frontend
    branch: render-deploy
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://medvoice-scheduler-poc-backend.onrender.com"

databases:
  - name: medvoice-scheduler-db
    plan: free
