services:
  - type: web
    name: medvoice-scheduler-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    branch: render-deploy
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medvoice-scheduler-db
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        value: "https://medvoice-scheduler-poc-1.onrender.com,https://medvoice-scheduler-frontend.onrender.com,http://localhost:5173"
      - key: DB_SEED_ON_STARTUP
        value: "true"
      - key: OPENAI_REALTIME_MODEL
        value: "gpt-realtime"
      - key: OPENAI_REALTIME_VOICE
        value: "alloy"
      - key: OPENAI_API_KEY
        sync: false
  - type: web
    name: medvoice-scheduler-mcp-server
    runtime: docker
    dockerfilePath: mcp-server/Dockerfile
    dockerContext: .
    branch: render-deploy
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medvoice-scheduler-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
  - type: web
    name: medvoice-scheduler-frontend
    runtime: static
    rootDir: frontend
    branch: render-deploy
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://medvoice-scheduler-poc-backend.onrender.com"

databases:
  - name: medvoice-scheduler-db
    plan: free
